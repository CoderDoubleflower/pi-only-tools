name: Apply cache-stable mode patch

on:
  push:
    branches:
      - fix/cache-stable-openai-responses

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and apply the cache-stable patch
        shell: bash
        run: |
          cat .github/cache-stable/chunk* \
            | base64 --decode \
            | xz --decompress --stdout \
            > /tmp/apply-pi-only-tools-cache-stable.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/apply-pi-only-tools-cache-stable.py")
          text = path.read_text(encoding="utf-8")
          marker = "EXPECTED_HEAD = 'af998bdcb6444ad4e7eeb49f7445ad8722e8ccf3'\n"
          helpers = marker + r'''


def run(command: list[str], cwd: Path, check: bool = True) -> subprocess.CompletedProcess[str]:
    completed = subprocess.run(command, cwd=cwd, text=True, capture_output=True)
    if check and completed.returncode != 0:
        detail = (completed.stderr or completed.stdout).strip()
        raise RuntimeError(
            f"command failed ({completed.returncode}): {' '.join(command)}"
            + (f"\n{detail}" if detail else "")
        )
    return completed


def git_output(repo: Path, *args: str) -> str:
    return run(['git', *args], repo).stdout.strip()
'''
          if "def git_output(" not in text:
              if text.count(marker) != 1:
                  raise RuntimeError("could not locate the application-script helper insertion point")
              text = text.replace(marker, helpers, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile /tmp/apply-pi-only-tools-cache-stable.py
          python3 /tmp/apply-pi-only-tools-cache-stable.py . --force-ref --run-tests

      - name: Build, check, and validate the diff
        shell: bash
        run: |
          npm run build
          npm run check
          git diff --check

      - name: Commit the verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test README.md CHANGELOG.md package.json
          if git diff --cached --quiet; then
            echo "The patch produced no implementation changes." >&2
            exit 1
          fi
          git commit -m "fix: keep mode tools cache-stable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
