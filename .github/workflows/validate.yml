name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.19.0
            pi: pinned
          - node: 24
            pi: pinned
          - node: 24
            pi: latest
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test against the latest Pi release
        if: matrix.pi == 'latest'
        run: npm install --ignore-scripts --no-save --package-lock=false @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest @earendil-works/pi-ai@latest
      - name: Build
        run: npm run build
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
