name: Ask Mode CI

on:
  push:
    branches:
      - feat/ask-mode

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
