name: Validate Shift Tab Plan UX

on:
  pull_request:
    branches:
      - ci/shift-tab-plan-ux

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shift-tab-plan-compact-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged implementation
        run: |
          node --check scripts/apply-shift-tab-compact-ui.mjs
          node scripts/apply-shift-tab-compact-ui.mjs
          node --check scripts/fix-shift-tab-tests.mjs
          node scripts/fix-shift-tab-tests.mjs
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Publish tested implementation
        shell: bash
        run: |
          rm -f scripts/apply-shift-tab-compact-ui.mjs
          rm -f scripts/fix-shift-tab-tests.mjs
          rm -f .github/workflows/validate-shift-tab-compact-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: toggle Plan Mode with Shift+Tab"
          git push origin HEAD:feat/shift-tab-plan-compact-ui
