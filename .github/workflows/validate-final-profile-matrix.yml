name: Validate final profile matrix tree

on:
  push:
    branches:
      - feat/profile-tool-matrix

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
