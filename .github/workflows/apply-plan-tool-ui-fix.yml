name: Apply Plan tool UI fix

on:
  push:
    branches:
      - fix/plan-tool-ui

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/plan-tool-ui

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Patch Plan tool rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          src_path = Path("src/plan/index.js")
          source = src_path.read_text()

          source = replace_once(
              source,
              'import { Key, matchesKey } from "@earendil-works/pi-tui";',
              'import { Key, Text, matchesKey } from "@earendil-works/pi-tui";',
              "pi-tui Text import",
          )
          source = replace_once(
              source,
              '        parameters: enterPlanSchema,\n        executionMode: "sequential",\n',
              '        parameters: enterPlanSchema,\n        executionMode: "sequential",\n        renderShell: "self",\n',
              "EnterPlanMode self shell",
          )
          source = replace_once(
              source,
              '        parameters: planWriteSchema,\n        executionMode: "sequential",\n',
              '        parameters: planWriteSchema,\n        executionMode: "sequential",\n        renderShell: "self",\n',
              "plan_write self shell",
          )
          source = replace_once(
              source,
              '        parameters: emptySchema,\n        executionMode: "sequential",\n',
              '        parameters: emptySchema,\n        executionMode: "sequential",\n        renderShell: "self",\n',
              "ExitPlanMode self shell",
          )
          source = replace_once(
              source,
              '                details: { plan: next.plan },\n',
              '                details: { plan: next.plan, content: params.content },\n',
              "plan_write render details",
          )
          source = replace_once(
              source,
              '''                details: { plan: next.plan, content: params.content },
            };
        },
    });
    pi.registerTool({
        name: EXIT_PLAN_MODE_TOOL,''',
              '''                details: { plan: next.plan, content: params.content },
            };
        },
        renderResult(result, options, theme) {
            if (options.isPartial) {
                return new Text(theme.fg("muted", "Writing plan…"), 0, 0);
            }
            const status = result.content.find((block) => block?.type === "text")?.text ?? "";
            const content = typeof result.details?.content === "string" ? result.details.content.trimEnd() : "";
            const parts = [];
            if (status)
                parts.push(theme.fg("muted", status));
            if (content)
                parts.push(theme.fg("toolOutput", content));
            return new Text(parts.join("\\n\\n"), 0, 0);
        },
    });
    pi.registerTool({
        name: EXIT_PLAN_MODE_TOOL,''',
              "plan_write result renderer",
          )
          src_path.write_text(source)

          test_path = Path("test/plan-integration.test.mjs")
          test = test_path.read_text()
          test = replace_once(
              test,
              'assert.equal(plan.enabled, true);\n',
              '''assert.equal(plan.enabled, true);
for (const toolName of ["EnterPlanMode", "plan_write", "ExitPlanMode"]) {
  assert.equal(tools.get(toolName).renderShell, "self", `${toolName} must render without the default padded tool shell`);
}
''',
              "Plan self-shell regression",
          )
          test = replace_once(
              test,
              'await tools.get("plan_write").execute("write", { content: validPlan, expected_revision: 1 }, undefined, undefined, ctx);\n',
              '''const writeResult = await tools.get("plan_write").execute(
  "write",
  { content: validPlan, expected_revision: 1 },
  undefined,
  undefined,
  ctx,
);
assert.equal(writeResult.details.content, validPlan);
const renderedPlan = tools
  .get("plan_write")
  .renderResult(writeResult, { expanded: false, isPartial: false }, { fg: (_color, text) => text })
  .render(400)
  .join("\\n");
assert.match(renderedPlan, /Canonical plan updated to revision 2/);
assert.match(renderedPlan, /# Implementation Plan/);
assert.match(renderedPlan, /## Verification/);
''',
              "plan_write UI regression",
          )
          test_path.write_text(test)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Syntax checks
        run: npm run check

      - name: Test
        run: npm test

      - name: Diff checks
        run: git diff --check

      - name: Commit tested fix
        run: |
          rm -f .github/workflows/apply-plan-tool-ui-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align Plan tool UI and show plan writes"
          git push origin HEAD:fix/plan-tool-ui
