name: Validate Normal Plan architecture

on:
  pull_request:
    branches:
      - ci/normal-plan-architecture

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-tool-matrix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged architecture correction
        run: |
          if [ -f scripts/remove-execution-profile.mjs ]; then
            node --check scripts/remove-execution-profile.mjs
            node scripts/remove-execution-profile.mjs
          fi
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Publish tested correction to feature branch
        if: ${{ hashFiles('scripts/remove-execution-profile.mjs') != '' }}
        shell: bash
        run: |
          rm -f scripts/remove-execution-profile.mjs
          rm -f .github/workflows/remove-execution-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: execute approved plans with Normal profile"
          git push origin HEAD:feat/profile-tool-matrix
