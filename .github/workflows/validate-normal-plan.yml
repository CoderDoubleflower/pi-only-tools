name: Validate vertical profile matrix

on:
  pull_request:
    branches:
      - ci/normal-plan-architecture

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vertical-profile-matrix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged UX follow-up
        run: |
          node --check scripts/finalize-vertical-profile-matrix.mjs
          node scripts/finalize-vertical-profile-matrix.mjs
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Publish tested UX to feature branch
        shell: bash
        run: |
          rm -f scripts/finalize-vertical-profile-matrix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: transpose profile matrix UX"
          git push origin HEAD:feat/vertical-profile-matrix
