name: Validate profile tool matrix

on:
  push:
    branches:
      - feat/profile-tool-matrix
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/profile-tool-matrix
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply profile matrix changes
        run: |
          if [ -f scripts/apply-profile-matrix.mjs ]; then
            node --check scripts/apply-profile-matrix.mjs
            node scripts/apply-profile-matrix.mjs
          fi

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build and test
        run: |
          npm run build
          npm run check
          npm test
          git diff --check

      - name: Commit tested implementation
        if: ${{ hashFiles('scripts/apply-profile-matrix.mjs') != '' }}
        shell: bash
        run: |
          rm -f scripts/apply-profile-matrix.mjs
          rm -f scripts/.profile-matrix-trigger
          rm -f .github/workflows/profile-tool-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure tools with a persistent profile matrix"
          git push origin HEAD:feat/profile-tool-matrix
