name: Upgrade Pi 0.84.3

on:
  push:
    branches:
      - chore/pi-0.84.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/pi-0.84.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Pin Pi 0.84.3 test dependencies
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.peerDependencies["@earendil-works/pi-coding-agent"] = ">=0.84.2 <0.85.0";
          pkg.peerDependencies["@earendil-works/pi-tui"] = ">=0.84.2 <0.85.0";
          pkg.devDependencies["@earendil-works/pi-coding-agent"] = "0.84.3";
          pkg.devDependencies["@earendil-works/pi-tui"] = "0.84.3";
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          python3 <<'PY'
          from pathlib import Path

          path = Path("test/test.mjs")
          source = path.read_text()
          import_anchor = 'const { default: plugin, __test } = await import("../src/index.js");\n'
          version_import = 'const { PROFILE_CONFIG_VERSION } = await import("../src/profile-config.js");\n'
          if version_import not in source:
              if import_anchor not in source:
                  raise SystemExit("Could not locate test import anchor")
              source = source.replace(import_anchor, import_anchor + version_import, 1)
          source = source.replace(
              'assert.equal(migratedProfileConfig.version, 2);',
              'assert.equal(migratedProfileConfig.version, PROFILE_CONFIG_VERSION);',
              1,
          )
          path.write_text(source)

          integration_path = Path("test/plan-integration.test.mjs")
          integration = integration_path.read_text()
          integration = integration.replace(
              'const sentMessages = [];\n',
              'const sentMessages = [];\nconst pendingDispatches = [];\n',
              1,
          )
          integration = integration.replace(
              '  sendUserMessage(content, options) { sentMessages.push({ user: content, options }); },',
              '''  sendUserMessage(content, options) {
            sentMessages.push({ user: content, options });
            if (options?.expandPromptTemplates !== true || typeof content !== "string" || !content.startsWith("/")) return;
            const [commandName, ...rest] = content.slice(1).split(/\\s+/);
            const command = commands.get(commandName);
            if (!command) throw new Error(`Unknown dispatched command: ${commandName}`);
            pendingDispatches.push(
              Promise.resolve().then(() => command.handler(rest.join(" "), ctx)),
            );
          },''',
              1,
          )
          integration = integration.replace(
              'await emit("agent_settled");\nassert.equal(reviewPrompts.length, 1,',
              'await emit("agent_settled");\nawait Promise.all(pendingDispatches);\nassert.equal(reviewPrompts.length, 1,',
              1,
          )
          integration_path.write_text(integration)
          PY

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Build
        run: npm run build

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json test/test.mjs test/plan-integration.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: upgrade Pi test baseline to 0.84.3"
          git push origin HEAD:chore/pi-0.84.3
