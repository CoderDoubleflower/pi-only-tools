name: Validate only-tools Plan menu fix

on:
  push:
    branches:
      - fix/only-tools-plan-menu

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/only-tools-plan-menu
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply menu fix
        run: |
          node --check scripts/fix-only-tools-plan-menu.mjs
          node scripts/fix-only-tools-plan-menu.mjs

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build and test
        run: |
          npm run build
          npm run check
          npm test
          git diff --check

      - name: Commit tested fix
        shell: bash
        run: |
          rm -f scripts/fix-only-tools-plan-menu.mjs
          rm -f .github/workflows/fix-only-tools-plan-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface Plan Mode in default only-tools menu"
          git push origin HEAD:fix/only-tools-plan-menu
