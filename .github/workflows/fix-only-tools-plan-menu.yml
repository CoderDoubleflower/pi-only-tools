name: Validate only-tools Plan menu fix

on:
  push:
    branches:
      - fix/only-tools-plan-menu
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/only-tools-plan-menu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --check
